<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>LeekFund Float</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      font-size: 12px;
      color: #e8e8e8;
    }
    #panel {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(16, 16, 20, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #titlebar {
      -webkit-app-region: drag;
      height: 26px;
      flex: none;
      display: flex;
      align-items: center;
      padding: 0 6px 0 10px;
      font-size: 11px;
      color: #9a9a9a;
      cursor: move;
    }
    #titlebar .btns { margin-left: auto; -webkit-app-region: no-drag; display: flex; }
    #titlebar button {
      border: none;
      background: transparent;
      color: #9a9a9a;
      font-size: 12px;
      width: 22px;
      height: 22px;
      cursor: pointer;
      border-radius: 4px;
      line-height: 1;
    }
    #titlebar button:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    #titlebar button.active { color: #f0c828; font-weight: 700; }
    #titlebar button.btntext { width: auto; padding: 0 5px; font-size: 11px; }
    #list { flex: 1; overflow-y: auto; padding: 0 8px 8px 8px; }
    #chartView { flex: 1; display: none; flex-direction: column; min-height: 0; }
    #chartView.show { display: flex; }
    #chartHeader {
      flex: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      font-size: 12px;
      color: #e8e8e8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #chartHeader button {
      border: none;
      background: transparent;
      color: #9a9a9a;
      font-size: 12px;
      height: 22px;
      padding: 0 6px;
      cursor: pointer;
      border-radius: 4px;
      line-height: 1;
    }
    #chartHeader button:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    #chartTitle { color: #e8e8e8; white-space: nowrap; }
    #chartLegend { margin-left: auto; font-size: 11px; color: #b8b8b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chart-tabs { display: flex; flex: none; }
    .chart-tabs .chart-tab.active { color: #f0c828; font-weight: 700; }
    #chartPeriod {
      background: #14141a;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #b8b8b8;
      font-size: 11px;
      padding: 1px 2px;
      outline: none;
    }
    #chartPeriod option {
      background: #14141a;
      color: #b8b8b8;
    }
    #chartCanvas { flex: 1; width: 100%; min-height: 0; display: block; }
    #addPanel { flex: none; display: none; padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    #addPanel input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #e8e8e8;
      font-size: 12px;
      padding: 4px 6px;
      outline: none;
    }
    #addPanel input:focus { border-color: #f0c828; }
    #addResults { max-height: 180px; overflow-y: auto; margin-top: 2px; }
    .add-result {
      display: flex;
      align-items: center;
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-result:hover { background: rgba(255, 255, 255, 0.1); }
    .add-result .rcode { color: #9a9a9a; margin-left: auto; }
    .add-hint { font-size: 11px; color: #9a9a9a; padding: 3px 6px; }
    #confirmBar {
      flex: none;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #e8e8e8;
    }
    #confirmBar button {
      border: none;
      border-radius: 4px;
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
    }
    #confirmYes { background: rgba(229, 57, 53, 0.75); color: #fff; }
    #confirmNo { background: rgba(255, 255, 255, 0.12); color: #e8e8e8; }
    #list::-webkit-scrollbar { width: 4px; }
    #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .group-row {
      padding: 3px 4px;
      font-size: 11px;
      color: #b8b8b8;
      display: flex;
      align-items: center;
      margin-top: 2px;
      white-space: nowrap;
    }
    .group-row.group-header { cursor: pointer; border-radius: 4px; }
    .group-row.group-header:hover { background: rgba(255, 255, 255, 0.06); }
    .group-row .gmarker { flex: none; width: 14px; color: #888; font-size: 10px; }
    .group-row .gname { font-weight: 600; }
    .group-row .gavg { margin-left: auto; }
    .group-row .del { opacity: 0; flex: none; width: 14px; text-align: center; color: #f0c828; font-size: 12px; cursor: pointer; }
    .group-row:hover .del { opacity: 1; }
    .group-row .pin { opacity: 0; flex: none; width: 16px; text-align: center; color: #888; font-size: 11px; cursor: pointer; }
    .group-row:hover .pin { opacity: 1; }
    .group-row .pin.pinned { opacity: 1; color: #f0c828; }
    .add-stock-row {
      padding: 2px 4px 2px 18px;
      font-size: 11px;
      color: #f0c828;
      cursor: pointer;
      border-radius: 3px;
      white-space: nowrap;
    }
    .add-stock-row:hover { background: rgba(255, 255, 255, 0.06); }
    .stock-row {
      display: flex;
      align-items: center;
      padding: 2px 4px;
      border-radius: 3px;
      white-space: nowrap;
      cursor: pointer;
    }
    .stock-row:hover { background: rgba(255, 255, 255, 0.06); }
    .stock-row .sname { flex: none; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
    .stock-row .sprice { flex: none; width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
    .stock-row .spct { flex: none; width: 58px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stock-row .del { opacity: 0; flex: none; width: 14px; text-align: center; color: #f0c828; font-size: 12px; cursor: pointer; }
    .stock-row:hover .del { opacity: 1; }
    .up { color: #f0c828; }
    .down { color: #6fb1ff; }
    .flat { color: #c8c8c8; }
    .risk { color: #f0c828; font-weight: 600; }
    #footer {
      flex: none;
      height: 18px;
      font-size: 10px;
      color: #6a6a6a;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }
    #footer .hint { margin-left: auto; }
    #opacitySlider { width: 70px; accent-color: #f0c828; margin-left: 6px; }
    body.bw { filter: grayscale(1); }
  </style>
</head>
<body>
  <div id="panel">
    <div id="titlebar">
      <span>🥬 韭菜悬浮窗</span>
      <span class="btns">
        <button id="btnAddStock" class="btntext" title="添加股票">+股</button>
        <button id="btnAddGroup" class="btntext" title="添加分组">+组</button>
        <button id="btnBw" class="btntext" title="黑白/彩色切换">黑白</button>
        <button id="btnGroupSort" title="分组排序：默认/平均涨跌幅降序">组</button>
        <button id="btnStockSort" title="个股排序：默认/涨跌幅降序">股</button>
        <button id="btnMin" title="隐藏到托盘">—</button>
        <button id="btnClose" title="退出">✕</button>
      </span>
    </div>
    <div id="chartView">
      <div id="chartHeader">
        <button id="chartBack" title="返回列表">←</button>
        <span id="chartTitle">--</span>
        <span id="chartLegend"></span>
        <span class="chart-tabs">
          <select id="chartPeriod">
            <option value="minute">分时</option>
            <option value="m1">1分钟</option>
            <option value="m5">5分钟</option>
            <option value="m15">15分钟</option>
            <option value="m60">60分钟</option>
            <option value="m120">120分钟</option>
            <option value="day">日K</option>
            <option value="week">周K</option>
            <option value="month">月K</option>
          </select>
        </span>
      </div>
      <canvas id="chartCanvas"></canvas>
    </div>
    <div id="addPanel">
      <input id="addInput" type="text" placeholder="输入股票名称/代码搜索" autocomplete="off" spellcheck="false" />
      <div id="addResults"></div>
    </div>
    <div id="list"></div>
    <div id="confirmBar">
      <span id="confirmText"></span>
      <button id="confirmYes">删除</button>
      <button id="confirmNo">取消</button>
    </div>
    <div id="footer">
      <span id="updated">--</span>
      <span class="hint">右键菜单</span>
      <input type="range" id="opacitySlider" min="15" max="100" value="92" title="窗口透明度" />
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>LeekFund Float</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      font-size: 12px;
      color: #e8e8e8;
    }
    #panel {
      position: relative;
      width: 100%;
      height: 100%;
      background: rgba(16, 16, 20, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #titlebar {
      -webkit-app-region: drag;
      height: 26px;
      flex: none;
      display: flex;
      align-items: center;
      padding: 0 6px 0 10px;
      font-size: 11px;
      color: #9a9a9a;
      cursor: move;
    }
    #titlebar .btns { margin-left: auto; -webkit-app-region: no-drag; display: flex; }
    #titlebar button {
      border: none;
      background: transparent;
      color: #9a9a9a;
      font-size: 12px;
      width: 22px;
      height: 22px;
      cursor: pointer;
      border-radius: 4px;
      line-height: 1;
    }
    #titlebar button:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    #titlebar button.active { color: #43a047; font-weight: 700; }
    #list { flex: 1; overflow-y: auto; padding: 0 8px 8px 8px; }
    #addPanel { flex: none; display: none; padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    #addPanel input {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #e8e8e8;
      font-size: 12px;
      padding: 4px 6px;
      outline: none;
    }
    #addPanel input:focus { border-color: #43a047; }
    #addResults { max-height: 180px; overflow-y: auto; margin-top: 2px; }
    .add-result {
      display: flex;
      align-items: center;
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .add-result:hover { background: rgba(255, 255, 255, 0.1); }
    .add-result .rcode { color: #9a9a9a; margin-left: auto; }
    .add-hint { font-size: 11px; color: #9a9a9a; padding: 3px 6px; }
    #list::-webkit-scrollbar { width: 4px; }
    #list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
    .group-row {
      padding: 3px 4px;
      font-size: 11px;
      color: #b8b8b8;
      display: flex;
      align-items: center;
      margin-top: 2px;
      white-space: nowrap;
    }
    .group-row.group-header { cursor: pointer; border-radius: 4px; }
    .group-row.group-header:hover { background: rgba(255, 255, 255, 0.06); }
    .group-row .gmarker { flex: none; width: 14px; color: #888; font-size: 10px; }
    .group-row .gname { font-weight: 600; }
    .group-row .gavg { margin-left: auto; }
    .stock-row {
      display: flex;
      align-items: center;
      padding: 2px 4px;
      border-radius: 3px;
      white-space: nowrap;
      cursor: pointer;
    }
    .stock-row:hover { background: rgba(255, 255, 255, 0.06); }
    .stock-row .sname { flex: none; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
    .stock-row .sprice { flex: none; width: 56px; text-align: right; font-variant-numeric: tabular-nums; }
    .stock-row .spct { flex: none; width: 58px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
    .up { color: #ff8a87; }
    .down { color: #7fd6a4; }
    .flat { color: #c8c8c8; }
    .risk { color: #ffd166; font-weight: 600; }
    #footer {
      flex: none;
      height: 18px;
      font-size: 10px;
      color: #6a6a6a;
      display: flex;
      align-items: center;
      padding: 0 8px;
    }
    #footer .hint { margin-left: auto; }
  </style>
</head>
<body>
  <div id="panel">
    <div id="titlebar">
      <span>🥬 韭菜悬浮窗</span>
      <span class="btns">
        <button id="btnGroupSort" title="分组排序：默认/平均涨跌幅降序">组</button>
        <button id="btnStockSort" title="个股排序：默认/涨跌幅降序">股</button>
        <button id="btnMin" title="隐藏到托盘">—</button>
        <button id="btnClose" title="退出">✕</button>
      </span>
    </div>
    <div id="addPanel">
      <input id="addInput" type="text" placeholder="输入股票名称/代码搜索" autocomplete="off" spellcheck="false" />
      <div id="addResults"></div>
    </div>
    <div id="list"></div>
    <div id="footer">
      <span id="updated">--</span>
      <span class="hint">列表滚轮滚动 · 其它区域调透明度 · 右键菜单</span>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
